name: Build Toon Studio APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android app around index.html
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/local-notifications@7
          mkdir www && cp ../index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.toonstudio.app",
            "appName": "Toon Studio",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "force" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ToonStudio.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToonStudio-apk
          path: ToonStudio.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Toon Studio build ${{ github.run_number }}
          files: ToonStudio.apk
